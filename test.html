<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="main.js"></script>
</head>

<body>
    <div>
        <table>
            <thead>
                <tr>
                    <td>
                        ID
                    </td>
                    <td>
                        Title
                    </td>
                    <td>
                        Views
                    </td>
                </tr>
            </thead>
            <tbody id="body-table">
                
            </tbody>
        </table>
    </div>
    <div>
        <input type="text" id="id_txt"/>
        <input type="text" id="title_txt"/>
        <input type="text" id="views_txt"/>
    </div>
    <div>
        <input type="submit" value="Save" onclick="Save()"/>
    </div>

    <hr/>
    <div>
        <h2>Comments Management</h2>
        <table>
            <thead>
                <tr>
                    <td>ID</td>
                    <td>Text</td>
                    <td>PostID</td>
                    <td>Actions</td>
                </tr>
            </thead>
            <tbody id="comment-body-table">
                
            </tbody>
        </table>
    </div>
    <div>
        <input type="text" id="comment_id_txt" placeholder="Comment ID (Leave empty for new)"/>
        <input type="text" id="comment_text_txt" placeholder="Comment Text"/>
        <input type="text" id="comment_post_id_txt" placeholder="Post ID"/>
        <input type="submit" value="Save Comment" onclick="SaveComment()"/>
    </div>
</body>

</html>
